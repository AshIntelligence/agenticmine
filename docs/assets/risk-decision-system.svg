<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="560" viewBox="0 0 1200 560" role="img" aria-labelledby="t d"><title id="t">Risk decision system</title><desc id="d">Signals flow through scoring, review boundaries and actions.</desc><defs><linearGradient id="bg" x1="0" x2="1"><stop stop-color="#0b101c"/><stop offset="1" stop-color="#19152b"/></linearGradient></defs><rect width="1200" height="560" rx="30" fill="url(#bg)"/><text x="70" y="84" fill="#fff" font-family="Arial,sans-serif" font-size="34" font-weight="700">Risk Decision System</text><text x="70" y="124" fill="#b7c3d7" font-family="Arial,sans-serif" font-size="20">Contain risk earlier without making “block everything” the product strategy.</text><g font-family="Arial,sans-serif" text-anchor="middle"><g fill="#131b2e" stroke-width="2"><rect x="65" y="210" width="215" height="105" rx="20" stroke="#63ead9"/><rect x="360" y="210" width="215" height="105" rx="20" stroke="#4678ff"/><rect x="655" y="210" width="215" height="105" rx="20" stroke="#9c7cff"/><rect x="950" y="210" width="185" height="105" rx="20" stroke="#ffb76a"/></g><g fill="#fff" font-size="20" font-weight="700"><text x="173" y="252">Signals</text><text x="468" y="252">Decision policy</text><text x="762" y="252">Human review</text><text x="1042" y="252">Action</text></g><g fill="#bdc9db" font-size="15"><text x="173" y="281">behavior · payment · identity</text><text x="468" y="281">severity · confidence</text><text x="762" y="281">ambiguity · consequence</text><text x="1042" y="281">allow · review · deny</text></g><g stroke="#718fcf" stroke-width="3"><path d="M280 263 H360"/><path d="M575 263 H655"/><path d="M870 263 H950"/></g><rect x="285" y="390" width="630" height="82" rx="20" fill="#161e34" stroke="#ff5a85"/><text x="600" y="424" fill="#fff" font-size="20" font-weight="700">Feedback closes the loop</text><text x="600" y="452" fill="#c6d0df" font-size="15">loss · false positives · customer friction · bad debt</text></g></svg>
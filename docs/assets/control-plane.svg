<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="560" viewBox="0 0 1200 560" role="img" aria-labelledby="t d"><title id="t">Agentic Product Control Plane</title><desc id="d">Control plane coordinates registry, evals, permissions, budgets and rollout.</desc><defs><linearGradient id="bg" x1="0" x2="1"><stop stop-color="#08111f"/><stop offset="1" stop-color="#0f2440"/></linearGradient></defs><rect width="1200" height="560" rx="30" fill="url(#bg)"/><text x="70" y="84" fill="#fff" font-family="Arial,sans-serif" font-size="34" font-weight="700">Agentic Product Control Plane</text><text x="70" y="124" fill="#afbdd3" font-family="Arial,sans-serif" font-size="20">The model is only one part of the system.</text><g font-family="Arial,sans-serif" text-anchor="middle"><rect x="420" y="205" width="360" height="120" rx="24" fill="#172c54" stroke="#63ead9" stroke-width="2"/><text x="600" y="250" fill="#fff" font-size="26" font-weight="700">CONTROL PLANE</text><text x="600" y="282" fill="#c8d6e8" font-size="16">policy · state · rollout · evidence</text><g fill="#111a2e" stroke="#4678ff" stroke-width="2"><rect x="70" y="185" width="230" height="85" rx="18"/><rect x="70" y="320" width="230" height="85" rx="18"/><rect x="900" y="185" width="230" height="85" rx="18"/><rect x="900" y="320" width="230" height="85" rx="18"/></g><g fill="#fff" font-size="19" font-weight="700"><text x="185" y="225">Agent Registry</text><text x="185" y="360">Evaluation Gates</text><text x="1015" y="225">Tool Permissions</text><text x="1015" y="360">Cost + Rollout</text></g><g stroke="#7ca4ff" stroke-width="3"><path d="M300 228 H420"/><path d="M300 362 H420"/><path d="M780 228 H900"/><path d="M780 362 H900"/></g><rect x="355" y="410" width="490" height="70" rx="18" fill="#121d34" stroke="#9c7cff"/><text x="600" y="452" fill="#d9e2f0" font-size="17">No rollout without eval, permission and budget state.</text></g></svg>